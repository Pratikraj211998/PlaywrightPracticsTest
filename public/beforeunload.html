<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Unsaved changes</title></head>
<body><h1>Unsaved changes page</h1><label for="note">Note</label><textarea id="note"></textarea>
<script>window.addEventListener('beforeunload', (e) => { if (document.getElementById('note').value) { e.preventDefault(); e.returnValue = ''; } });</script></body></html>
