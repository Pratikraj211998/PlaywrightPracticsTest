<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive</title>
  <style>
    #menu-toggle{display:none}
    #full-nav{display:block}
    @media (max-width: 600px){ #menu-toggle{display:inline-block} #full-nav{display:none} }
    @media (prefers-color-scheme: dark){ body{background:#111;color:#eee} }
  </style>
</head>
<body>
  <h1>Responsive page</h1>
  <button id="menu-toggle" aria-label="Open menu">Menu</button>
  <nav id="full-nav" aria-label="Full navigation"><a href="/">Home</a> <a href="/shop.html">Shop</a></nav>
  <p id="lang"></p>
  <script>document.getElementById('lang').textContent = 'Language: ' + navigator.language;</script>
</body></html>
